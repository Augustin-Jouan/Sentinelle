name: CI

on:
  push:
  pull_request:

jobs:
  verifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # exceljs dépend de uuid < 11 sans correctif compatible : on bloque les avis hauts, pas ce moderate.
      - run: npm audit --omit=dev --audit-level=high
